[package]
name = "yruler"
version = "0.1.0"
edition = "2021"
description = "Measure the human Y chromosome satellite arrays from sequencing reads"
license = "MIT"

[dependencies]
libc = "0.2"
rust-htslib = { version = "1.0.2", default-features = false, features = ["bzip2", "lzma", "curl", "s3", "gcs"] }
zstd = "0.14.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
